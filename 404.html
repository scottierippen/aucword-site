<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
  <link rel="icon" type="image/png" href="/favicon-16.png" sizes="16x16" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <title>Page not found — Aucword</title>
  <meta name="description" content="That page doesn't exist. Head back to aucword.com to track your eBay auctions.">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#151929">

  <link rel="preload" href="/fonts/dm-sans-latin-var.woff2" as="font" type="font/woff2" crossorigin />
  <style>
    /* DM Sans by the DM Sans Project Authors, SIL Open Font License 1.1 — see /fonts/OFL.txt */
    @font-face {
      font-family: 'DM Sans';
      font-style: normal;
      font-weight: 100 1000;
      font-display: swap;
      src: url('/fonts/dm-sans-latin-var.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }

    :root {
      --navy: #151929;
      --navy-light: #1e2540;
      --lavender: #c5b8f5;
      --peach: #f5c5a0;
      --white: #ffffff;
      --white-60: rgba(255,255,255,0.6);
      --white-30: rgba(255,255,255,0.3);
      --white-10: rgba(255,255,255,0.08);
      --font: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--navy);
      color: var(--white);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
      gap: 8px;
    }

    .code {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--lavender);
      margin-bottom: 8px;
    }

    h1 {
      font-size: clamp(28px, 6vw, 44px);
      font-weight: 700;
      line-height: 1.15;
      margin-bottom: 14px;
    }

    h1 em {
      font-style: normal;
      background: linear-gradient(135deg, var(--lavender), var(--peach));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    p {
      font-size: 17px;
      color: var(--white-60);
      max-width: 440px;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, var(--lavender), var(--peach));
      color: var(--navy);
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
      padding: 15px 30px;
      border-radius: 14px;
      transition: transform 0.2s ease;
    }

    .btn:hover { transform: translateY(-2px); }

    .links {
      display: flex;
      gap: 22px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 28px;
    }

    .links a {
      font-size: 14px;
      color: var(--white-30);
      text-decoration: none;
    }

    .links a:hover { color: var(--white); }

    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: 0.001s !important; }
    }
  </style>
</head>
<body>

  <div class="code">Error 404</div>
  <h1>This auction<br/><em>already ended.</em></h1>
  <p>The page you were after doesn't exist. Everything else is still where you left it.</p>

  <a href="/" class="btn">Back to Aucword</a>

  <div class="links">
    <a href="/support">Support</a>
    <a href="/privacy">Privacy</a>
    <a href="https://apps.apple.com/app/apple-store/id6759997767?pt=128248580&amp;ct=website_404&amp;mt=8">App Store</a>
    <a href="mailto:hi@aucword.com">Contact</a>
  </div>

</body>
</html>
